name: wf-cd-release
on:
  push:
    branches:
      - release/**
jobs:
  upload-artifact-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository On the Runner
        uses: actions/checkout@v4
        with:
          ref: "${{github.ref}}"
      - name: Checked Out Branch Name
        run: echo "Branch Name ${{github.ref}}"
      - name: Build Website with Parcel
        run: npx parcel build "./src/index.html" --dist-dir "./rel-dist" --public-url "./"
      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./rel-dist"
          name: "build-artifact-release"

  deploy-artifact-release:
    needs: "upload-artifact-release"
    runs-on: ubuntu-latest
    environment:
      name: "staging-env"
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Build Artifacts GH Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: "build-artifact-release"
          token: "${{github.token}}"
